<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lead Finder · SiteOn</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232f80ed'/><path d='M10 17l4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#16181d;--muted:#667085;--line:#e4e7ec;--accent:#2f80ed;--chip:#eef2f7;--bad:#d92d20;--mid:#dc6803;--ok:#079455;--shadow:0 1px 2px rgba(16,24,40,.06)}
[data-theme=dark]{--bg:#0e1013;--panel:#171a1f;--text:#e7e9ee;--muted:#98a2b3;--line:#2a2f37;--accent:#5b9cff;--chip:#222730;--bad:#f97066;--mid:#fdb022;--ok:#32d583;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1400px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:700;font-size:16px;margin-right:6px;white-space:nowrap}
select,input,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1;min-width:160px}
.mcity{display:none;color:var(--muted);font-size:12px}.mcontact{display:none}
button{cursor:pointer;background:var(--panel)}button:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.spacer{flex:1}
main{max-width:1400px;margin:auto;padding:12px 16px 40px}
.meta{color:var(--muted);margin:4px 0 12px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--text)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;background:var(--panel);position:sticky;top:var(--hh,57px);z-index:2}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--chip)}
.score{display:inline-block;min-width:34px;text-align:center;font-weight:700;border-radius:6px;padding:2px 6px;color:#fff}
.s2{background:var(--bad)}.s3{background:var(--mid)}.s4{background:#b54708}.s5,.s6,.s7,.s8,.s9,.s10{background:var(--ok)}
.name{font-weight:600}.dom{color:var(--muted);font-size:12px}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 8px;font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.contact a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.issues{color:var(--muted);font-size:13px;max-width:420px}
.thumb{width:120px;height:79px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line);background:var(--chip)}
dialog{border:none;border-radius:14px;padding:0;max-width:980px;width:94vw;background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:grid;grid-template-columns:1.3fr 1fr;gap:0}
.dlg img{width:100%;display:block;border-right:1px solid var(--line)}
.dlg .info{padding:16px 18px;overflow:auto;max-height:80vh}
.dlg h2{margin:0 0 4px;font-size:18px}
.kv{margin:10px 0}.kv div{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.close{position:absolute;right:10px;top:8px;border:none;background:transparent;font-size:22px}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:820px){
 th.hide,td.hide,th.city,td.city,th.ccol,td.ccol{display:none}.mcity,.mcontact{display:block}
 .mcontact a{display:inline-block;margin:4px 10px 0 0;font-size:13px}
 th,td{padding:8px 6px}.contact a{max-width:170px;font-size:13px}
 .bar select,.bar button{padding:6px 8px}
 .dlg{grid-template-columns:1fr}.dlg img{border-right:none;border-bottom:1px solid var(--line)}
 th{top:0}
}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">🔎 Lead Finder</span>
  <select id="list" title="Lead list"></select>
  <input id="q" type="search" placeholder="Search name, city, email, issue…">
  <select id="cat"><option value="">All categories</option></select>
  <select id="city"><option value="">All cities</option></select>
  <select id="maxs" title="Design score"><option value="10">Any score</option><option value="2">Score ≤ 2</option><option value="3">Score ≤ 3</option><option value="4">Score ≤ 4</option></select>
  <select id="has" title="Contact filter"><option value="">Any contact</option><option value="email">Has email</option><option value="phone">Has phone</option><option value="wa">Has WhatsApp</option></select>
  <button id="csv" class="primary" title="Download the rows currently shown">⬇ CSV</button>
  <button id="theme" title="Toggle dark / light">◐</button>
</div></header>
<main>
  <div class="meta" id="meta"></div>
  <table>
    <thead><tr>
      <th data-k="score">Score</th><th class="hide">Preview</th><th data-k="name">Business</th><th data-k="category" class="hide">Category</th><th data-k="city" class="city">City</th><th class="ccol">Contact</th><th class="hide">Why pitch</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No leads match these filters.</div>
</main>
<dialog id="dlg"></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLS = ['score','name','website','category','city','state','country','emails','phones','whatsapp','instagram','facebook','linkedin','platform','issues','pitch','screenshot','status','notes'];
let LISTS = [], DATA = [], VIEW = [], sortK = 'score', sortDir = 1;

// theme
const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.theme = t; };
setTheme(localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// tiny CSV parser / writer (lists may be .json or .csv)
function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c; }
  if (f || row.length) { row.push(f); rows.push(row); }
  const [h, ...body] = rows.filter(r => r.some(x => x !== ''));
  return body.map(r => Object.fromEntries(h.map((k, i) => [k.trim(), r[i] ?? ''])));
}
const toCSV = rows => [COLS.join(','), ...rows.map(r => COLS.map(k => { let v = r[k]; if (Array.isArray(v)) v = v.join(' | '); v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','))].join('\n');
const arr = v => Array.isArray(v) ? v : String(v || '').split('|').map(s => s.trim()).filter(Boolean);

async function loadLists() {
  LISTS = await (await fetch('data/lists.json', {cache: 'no-cache'})).json();
  $('#list').innerHTML = LISTS.map((l, i) => `<option value="${i}">${esc(l.title)}</option>`).join('');
  const want = new URLSearchParams(location.hash.slice(1)).get('list');
  const idx = Math.max(0, LISTS.findIndex(l => l.id === want));
  $('#list').value = idx; await loadList(idx);
}
async function loadList(i) {
  const l = LISTS[i]; const res = await fetch('data/' + l.file, {cache: 'no-cache'});
  const raw = l.file.endsWith('.csv') ? parseCSV(await res.text()) : await res.json();
  DATA = raw.map(r => ({...r, score: +r.score || 0, emails: arr(r.emails), phones: arr(r.phones)}));
  history.replaceState(null, '', '#list=' + encodeURIComponent(l.id));
  fillSelect('#cat', 'category', 'All categories'); fillSelect('#city', 'city', 'All cities');
  render();
}
function fillSelect(sel, key, label) {
  const counts = {}; DATA.forEach(r => r[key] && (counts[r[key]] = (counts[r[key]] || 0) + 1));
  $(sel).innerHTML = `<option value="">${label}</option>` + Object.keys(counts).sort().map(k => `<option>${esc(k)}</option>`).join('');
}
function render() {
  const q = $('#q').value.toLowerCase().trim(), cat = $('#cat').value, city = $('#city').value, maxs = +$('#maxs').value, has = $('#has').value;
  VIEW = DATA.filter(r => (!cat || r.category === cat) && (!city || r.city === city) && r.score <= maxs
    && (!has || (has === 'email' ? r.emails.length : has === 'phone' ? r.phones.length : r.whatsapp))
    && (!q || JSON.stringify(r).toLowerCase().includes(q)));
  VIEW.sort((a, b) => { const x = a[sortK], y = b[sortK]; return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * sortDir || a.name.localeCompare(b.name); });
  const l = LISTS[$('#list').value];
  $('#meta').innerHTML = `<span><b>${VIEW.length}</b> of ${DATA.length} leads</span><span>${esc(l.description || '')}</span>${l.created ? `<span>Updated ${esc(l.created)}</span>` : ''}`;
  $('#empty').hidden = VIEW.length > 0;
  $('#rows').innerHTML = VIEW.map((r, i) => `<tr data-i="${i}">
    <td><span class="score s${r.score}">${r.score}/10</span></td>
    <td class="hide">${r.screenshot ? `<img class="thumb" loading="lazy" src="${esc(r.screenshot)}" alt="">` : ''}</td>
    <td><div class="name">${esc(r.name)}</div><a class="dom" href="${esc(r.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(r.website.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a><span class="mcity">${esc([r.city, r.category].filter(Boolean).join(' · '))}</span><div class="mcontact" onclick="event.stopPropagation()">${contactHTML(r, 1)}</div></td>
    <td class="hide"><span class="chip">${esc(r.category)}</span></td>
    <td class="city">${esc(r.city)}${r.country && r.country !== 'India' ? `<div class="dom">${esc(r.country)}</div>` : ''}</td>
    <td class="contact ccol" onclick="event.stopPropagation()">${contactHTML(r, 2)}</td>
    <td class="hide issues">${esc(r.issues)}</td></tr>`).join('');
}
function contactHTML(r, n = 99) {
  const out = [];
  r.emails.slice(0, n).forEach(e => out.push(`<a href="mailto:${esc(e)}">✉ ${esc(e)}</a>`));
  r.phones.slice(0, n).forEach(p => out.push(`<a href="tel:${esc(p)}">☎ ${esc(p)}</a>`));
  if (r.whatsapp) out.push(`<a href="${esc(r.whatsapp)}" target="_blank" rel="noopener">💬 WhatsApp</a>`);
  if (n > 2) for (const k of ['instagram', 'facebook', 'linkedin']) if (r[k]) out.push(`<a href="${esc(r[k])}" target="_blank" rel="noopener">${k}</a>`);
  return out.join('') || '<span class="dom">via website form</span>';
}
$('#rows').onclick = e => { const tr = e.target.closest('tr'); if (!tr) return; const r = VIEW[tr.dataset.i];
  $('#dlg').innerHTML = `<button class="close" onclick="dlg.close()">×</button><div class="dlg">
    <a href="${esc(r.website)}" target="_blank" rel="noopener">${r.screenshot ? `<img src="${esc(r.screenshot)}" alt="screenshot">` : ''}</a>
    <div class="info"><h2>${esc(r.name)}</h2><a href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.website)}</a>
    <div class="kv"><div>Design score</div><span class="score s${r.score}">${r.score}/10</span> <span class="chip">${esc(r.category)}</span> <span class="chip">${esc([r.city, r.state, r.country].filter(Boolean).join(', '))}</span>${r.platform ? ` <span class="chip">${esc(r.platform)}</span>` : ''}</div>
    <div class="kv"><div>Contact</div><div class="contact" style="text-transform:none;font-size:14px">${contactHTML(r)}</div></div>
    <div class="kv"><div>Design issues</div>${esc(r.issues)}</div>
    ${r.pitch ? `<div class="kv"><div>Pitch angle</div>${esc(r.pitch)}</div>` : ''}
    ${r.notes ? `<div class="kv"><div>Notes</div>${esc(r.notes)}</div>` : ''}</div></div>`;
  $('#dlg').showModal(); };
$('#dlg').onclick = e => { if (e.target === $('#dlg')) $('#dlg').close(); };
document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = sortK === k ? -sortDir : 1; sortK = k; render(); });
['#q', '#cat', '#city', '#maxs', '#has'].forEach(s => $(s).addEventListener('input', render));
$('#list').onchange = e => loadList(+e.target.value);
$('#csv').onclick = () => {
  const l = LISTS[$('#list').value];
  const rows = VIEW.map(r => ({...r, screenshot: r.screenshot ? new URL(r.screenshot, location.href).href : ''}));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + toCSV(rows)], {type: 'text/csv'}));
  a.download = `${l.id}${VIEW.length < DATA.length ? '-filtered' : ''}.csv`; a.click(); };
const setHH = () => document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
addEventListener('resize', setHH); setHH();
loadLists().catch(e => { $('#empty').hidden = false; $('#empty').textContent = 'Could not load data: ' + e.message; });
</script>
</body>
</html>
